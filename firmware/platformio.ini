; 智能风扇固件 —— PlatformIO 工程
; 目标：STM32F103C8T6（蓝板核心板 / 自制板同芯片），STM32Cube HAL
;
; 常用命令：
;   pio run                编译
;   pio run -t upload      通过 ST-Link 烧录
;   pio device monitor     串口监视（115200，接 PA9/PA10 或板载 USB 转串口）
;
; 若改用 STM32CubeIDE：可直接用 CubeMX 生成工程，
; 把 src/ 下的业务代码移植过去即可，HAL 层保持不变。
[platformio]
default_envs = bluepill_f103c8

[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = stm32cube
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200

build_flags =
    -D USE_HAL_DRIVER
    -D STM32F103xB
    -Wall
    -Wextra
    -Wno-unused-parameter

; 依赖（示例，按需启用）
; lib_deps =
;     olikraus/U8g2@^2.35.19        ; OLED 驱动（SSD1306/SH1106）
